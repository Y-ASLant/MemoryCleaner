name: Build

on:
  push:
    branches: [Lite]
    tags: ["v*"]
  pull_request:
    branches: [Lite]

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = $env:GITHUB_REF_NAME
          # Accepts v1.0.0 or v1.0.0-lite tag suffix.
          if ($tag -ne "v$version" -and $tag -ne "v$version-lite") {
            throw "Tag $tag does not match package version v$version or v$version-lite"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: cargo clippy --release -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: MemoryCleanerLite-windows-x64
          path: target/release/MemoryCleanerLite.exe
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: pwsh
        run: |
          # Tags: v1.0.0 or v1.0.0-lite → changelog heading [1.0.0]
          $raw = $env:GITHUB_REF_NAME
          if ($raw -notmatch '^v(?<ver>\d+\.\d+\.\d+)(-lite)?$') {
            throw "Unsupported tag $raw (expected vX.Y.Z or vX.Y.Z-lite)"
          }
          $pkg = $Matches['ver']
          $version = [regex]::Escape($pkg)
          $content = Get-Content docs/CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$version\].*?(?=^## \[|^---\s*$|\z)"
          $sections = [regex]::Matches($content, $pattern)
          if ($sections.Count -ne 2) {
            throw "Expected Chinese and English changelog sections for v$pkg (tag $raw), found $($sections.Count)"
          }
          ($sections.Value.Trim() -join "`n`n---`n`n") |
            Set-Content release-notes.md -Encoding utf8NoBOM

      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: MemoryCleanerLite-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release/MemoryCleanerLite.exe
