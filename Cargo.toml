[package]
name = "memory-cleaner"
version = "1.2.1"
edition = "2024"
description = "Memory Cleaner"
license = "MIT"
repository = "https://github.com/Y-ASLant/MemoryCleaner"

[package.metadata.winres]
OriginalFilename = "MemoryCleaner.exe"
FileDescription = "Memory Cleaner"
ProductName = "Memory Cleaner"
InternalName = "MemoryCleaner"

[[bin]]
name = "MemoryCleaner"
path = "src/main.rs"

[lib]
name = "memory_cleaner"
path = "src/lib.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "deny", priority = 10 }

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
serde = { version = "1.0.229", features = ["derive"] }
tray-icon = { version = "0.26.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "display", "serde"] }
rust-i18n = "4.2.4"
# windows features: only those not already enabled transitively by another listed feature
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
    "Wdk_System_SystemServices",
] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "network"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[build-dependencies]
winres = "0.1.12"
